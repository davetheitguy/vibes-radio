<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibes Radio Map</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root{
    --bg:#0f1420; --panel:#151c2c; --panel2:#1b2336; --text:#e8ecf4; --muted:#8b96ab;
    --accent:#4f9cff; --green:#35d07f; --amber:#f5b84d; --red:#f26d6d; --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden}

  #sidebar{position:absolute;left:0;top:0;bottom:0;width:340px;z-index:500;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column}
  #sidebar header{padding:14px 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #sidebar header .titles{min-width:0}
  #sidebar h1{margin:0;font-size:16px}
  #sidebar .sub{margin:4px 0 0;font-size:12px;color:var(--muted)}

  #filters{padding:4px 12px 10px;display:flex;flex-direction:column;gap:6px}
  #filters select{width:100%;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;cursor:pointer}
  #filters select:hover{border-color:rgba(79,156,255,.5)}
  #filters select:focus{outline:none;border-color:var(--accent)}
  #filters input[type="search"]{width:100%;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);border-radius:8px}
  #filters input[type="search"]:hover{border-color:rgba(79,156,255,.5)}
  #filters input[type="search"]:focus{outline:none;border-color:var(--accent)}
  #filters input[type="search"]::placeholder{color:var(--muted)}

  #station-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .station{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;
    border:1px solid var(--border);border-radius:10px;background:var(--panel2);
    transition:border-color .15s,background .15s}
  .station:hover{border-color:rgba(79,156,255,.5)}
  .station.playing{border-color:var(--accent);background:rgba(79,156,255,.12)}
  .station .logo{width:34px;height:34px;flex:none;object-fit:cover;border-radius:8px;
    background:#0d1220;border:1px solid var(--border)}
  .station .freq{min-width:52px;font-size:11.5px;font-weight:700;color:var(--accent);
    text-align:center;background:rgba(79,156,255,.12);padding:3px 4px;border-radius:6px}
  .station .meta{flex:1;min-width:0}
  .station .name{display:block;font-size:13px;padding-right:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .station .tags{margin-top:2px;font-size:11px;color:var(--muted)}
  #map{position:absolute;top:0;bottom:0;left:340px;right:0;background:#0a0e16}
  .leaflet-container{font:inherit}
  .leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .leaflet-tooltip-top:before{border-top-color:var(--panel)}
  .leaflet-bar{border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .leaflet-control-zoom a{background:var(--panel2);color:var(--text);border-bottom:1px solid var(--border)}
  .leaflet-control-zoom a:hover{background:rgba(79,156,255,.28)}
  .leaflet-control-zoom a.leaflet-disabled{background:#10151f;color:#46536b}
  .leaflet-control-attribution{background:rgba(21,28,44,.85)!important;color:var(--muted)!important}
  .leaflet-control-attribution a{color:var(--accent)!important}

  .pin{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .pin .dot{width:32px;height:32px;background:#232d44;border:2px solid #3b4a6b;
    border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,box-shadow .15s}
  .pin .dot img{width:20px;height:20px;object-fit:contain;transform:rotate(45deg);pointer-events:none}
  .pin:hover .dot{border-color:var(--accent)}
  .pin.playing .dot{background:var(--accent);border-color:#9cc6ff;box-shadow:0 0 0 6px rgba(79,156,255,.25)}
  .pin.playing::after{content:"";position:absolute;left:50%;top:22px;width:44px;height:44px;
    border-radius:50%;border:2px solid var(--accent);pointer-events:none;
    animation:pin-ping 1.8s ease-out infinite}
  @keyframes pin-ping{
    0%{transform:translate(-50%,-50%) scale(.5);opacity:.85}
    70%,100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}
  }

  .cluster-badge{width:46px;height:46px;border-radius:50%;
    background:rgba(27,35,54,.95);border:2px solid var(--accent);color:var(--text);
    font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .cluster-badge.playing{border-color:var(--green);box-shadow:0 0 0 5px rgba(53,208,127,.25)}

  #player{position:absolute;left:calc(340px + 16px);right:16px;bottom:18px;z-index:500;
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:rgba(21,28,44,.92);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #play-btn{width:42px;height:42px;flex:none;border:none;border-radius:50%;cursor:pointer;
    background:var(--accent);color:#0b1120;font-size:16px;
    display:flex;align-items:center;justify-content:center}
  #play-btn:hover{filter:brightness(1.12)}
  #player .info{flex:1;min-width:0}
  #player .p-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player .p-sub{margin-top:1px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #vol{width:110px;accent-color:var(--accent);cursor:pointer}
  #eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:8px;vertical-align:-1px}
  #eq[hidden]{display:none}
  #eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
  #eq i:nth-child(1){height:60%;animation-delay:0s}
  #eq i:nth-child(2){height:100%;animation-delay:.25s}
  #eq i:nth-child(3){height:45%;animation-delay:.5s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  #status{position:absolute;left:calc(340px + 16px);bottom:84px;z-index:500;display:none;
    max-width:min(540px,70%);padding:9px 13px;font-size:12.5px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #status.show{display:block}
  #status.error{border-color:rgba(242,109,109,.6);background:rgba(58,22,26,.95);color:#ffd7d7}
  #status.ok{border-color:rgba(53,208,127,.5);background:rgba(15,42,29,.95);color:#c9f5dd}

  /* Add-station button — top-right of the station list column */
  #add-fab{flex:none;width:34px;height:34px;
    border:none;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;color:#0b1120;
    background:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    transition:filter .15s,transform .15s}
  #add-fab:hover{filter:brightness(1.12);transform:scale(1.06)}
  #add-fab:active{transform:scale(.97)}

  /* X button in the top-right of station rows (appears on hover; absolutely
     positioned so the row never changes size) */
  .station .del{position:absolute;top:5px;right:5px;display:none;width:18px;height:18px;
    border:none;border-radius:5px;background:rgba(255,255,255,.06);color:var(--muted);
    cursor:pointer;padding:0;align-items:center;justify-content:center;
    transition:background .12s,color .12s}
  .station .del svg{width:11px;height:11px}
  .station .del:hover{background:rgba(242,109,109,.2);color:var(--red)}
  .station:hover .del{display:flex}
  @media (hover: none){ .station .del{display:flex} }

  /* Modal dialogs (add station / confirm delete) */
  .overlay{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;
    background:rgba(5,8,14,.6);backdrop-filter:blur(3px)}
  .overlay.show{display:flex}
  .dialog{width:min(430px,92vw);max-height:90vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .dialog h2{margin:0 0 12px;font-size:15px}
  .dialog .field{margin-bottom:10px}
  .dialog label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .dialog label .req{color:var(--accent)}
  .dialog input,.dialog select{width:100%;padding:8px 10px;font:inherit;font-size:13px;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);border-radius:8px}
  .dialog input:hover{border-color:rgba(79,156,255,.5)}
  .dialog input:focus{outline:none;border-color:var(--accent)}
  .dialog .row2{display:flex;gap:10px}
  .dialog .row2 .field{flex:1}
  .dialog label.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin:0}
  .dialog label.check input{width:auto;accent-color:var(--accent)}
  .dialog .msg{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.45}
  .dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
  .btn{padding:8px 14px;font:inherit;font-size:13px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  .btn:hover{filter:brightness(1.18)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1120;font-weight:600}
  .btn.danger{background:var(--red);border-color:var(--red);color:#2b0d0d;font-weight:600}

  @media (max-width: 860px){
    #sidebar{width:100%;height:44%;min-height:180px;bottom:0;border-right:none;border-top:1px solid var(--border)}
    #filters{flex-direction:row;flex-wrap:wrap}
    #filters select, #filters input[type="search"]{width:auto;flex:1 1 92px}
  }
</style>
</head>
<body>
  <div id="sidebar">
    <header>
      <div class="titles">
        <h1>Vibes Radio Map</h1>
        <p class="sub"><span id="count">0</span> of <span id="total">0</span> stations &middot; click a pin or a list entry to listen</p>
      </div>
      <button id="add-fab" title="Add a station" aria-label="Add a station">+</button>
    </header>
    <div id="filters">
      <input id="f-search" type="search" placeholder="Search name, frequency, or city&hellip;" aria-label="Search stations">
      <select id="f-country" aria-label="Filter by country"></select>
      <select id="f-region" aria-label="Filter by region"></select>
      <select id="f-city" aria-label="Filter by city"></select>
    </div>
    <div id="station-list"></div>

  </div>

  <div id="map"></div>
  <div id="status" role="status"></div>

  <div id="player">
    <button id="play-btn" title="Play / Pause">&#9654;</button>
    <div class="info">
      <div class="p-name"><span id="eq" hidden><i></i><i></i><i></i></span><span id="p-title">Nothing playing</span></div>
      <div class="p-sub" id="p-sub">Pick a station to start</div>
    </div>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" title="Volume">
  </div>

  <div id="add-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="dialog">
      <h2 id="add-title">Add a station</h2>
      <form id="add-form">
        <div class="field"><label for="a-name">Name <span class="req">*</span></label>
          <input id="a-name" required maxlength="120" placeholder="e.g. CBC Ottawa 102.1"></div>
        <div class="field"><label for="a-stream">Stream URL <span class="req">*</span></label>
          <input id="a-stream" type="url" required placeholder="https://…/stream.mp3 or .m3u8"></div>
        <div class="row2">
          <div class="field"><label for="a-freq">Frequency</label><input id="a-freq" placeholder="e.g. 102.1 FM"></div>
          <div class="field"><label for="a-codec">Codec</label><input id="a-codec" placeholder="MP3, AAC, Opus…"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="a-country">Country</label><input id="a-country" placeholder="Canada"></div>
          <div class="field"><label for="a-region">Region</label><input id="a-region" placeholder="Ontario"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="a-city">City</label><input id="a-city" placeholder="Ottawa"></div>
          <div class="field"><label for="a-logo">Logo URL</label><input id="a-logo" type="url" placeholder="https://…/logo.png"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="a-lat">Latitude</label><input id="a-lat" type="number" step="any" placeholder="45.42"></div>
          <div class="field"><label for="a-lng">Longitude</label><input id="a-lng" type="number" step="any" placeholder="-75.70"></div>
        </div>
        <div class="field"><label class="check" for="a-hls"><input id="a-hls" type="checkbox"> HLS (m3u8) stream</label></div>
        <div class="actions">
          <button type="button" class="btn" id="add-cancel">Cancel</button>
          <button type="submit" class="btn primary">Add station</button>
        </div>
      </form>
    </div>
  </div>

  <div id="del-overlay" class="overlay" role="alertdialog" aria-modal="true" aria-labelledby="del-title">
    <div class="dialog" style="width:min(370px,92vw)">
      <h2 id="del-title">Delete station?</h2>
      <p class="msg" id="del-msg"></p>
      <div class="actions">
        <button type="button" class="btn" id="del-cancel">Cancel</button>
        <button type="button" class="btn danger" id="del-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const audio = new Audio();
audio.preload = "none";
audio.volume = 0.8;

let stations = [];
let markers = new Map();
let clusterGroup = null; // Leaflet.markercluster group
let current = null;      // id of selected station
let hls = null;
let statusTimer = null;
let filters = { country: "", region: "", city: "", search: "" };

const map = L.map("map");
// Default center if geolocation fails
let defaultCenter = [45.5017, -73.5673];
function setMapView(position) {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  map.setView([lat, lng], 12);
}
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(setMapView, () => map.setView(defaultCenter, 12));
} else {
  map.setView(defaultCenter, 12);
}
// Map tiles: plain OpenStreetMap standard tiles — no API key required.
// Note: no {r} retina placeholder — tile.openstreetmap.org returns 400 for @2x tiles.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function proxied(st) { return "/station/" + st.id + "/stream"; }
const RADIO_ICON =
  "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a9b8d4%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223%22%20y%3D%228%22%20width%3D%2218%22%20height%3D%2212%22%20rx%3D%222%22%2F%3E%3Cline%20x1%3D%227%22%20y1%3D%228%22%20x2%3D%2219%22%20y2%3D%223%22%2F%3E%3Ccircle%20cx%3D%228.5%22%20cy%3D%2214%22%20r%3D%222.5%22%2F%3E%3Cline%20x1%3D%2214.5%22%20y1%3D%2212%22%20x2%3D%2218%22%20y2%3D%2212%22%2F%3E%3Cline%20x1%3D%2214.5%22%20y1%3D%2216%22%20x2%3D%2218%22%20y2%3D%2216%22%2F%3E%3C%2Fsvg%3E";
window.RADIO_ICON = RADIO_ICON;
function logoImg(st, cls) {
  const src = st.logo ? "/station/" + st.id + "/logo" : RADIO_ICON;
  return '<img class="' + cls + '" src="' + src + '" alt="" ' +
    'onerror="this.onerror=null;this.src=window.RADIO_ICON">';
}
function fmtFreq(st) { return st.frequency ? st.frequency : "Web"; }

function uniqSorted(vals) {
  return [...new Set(vals.filter(Boolean))].sort((a, b) => a.localeCompare(b));
}
function visible() {
  const q = filters.search.trim().toLowerCase();
  return stations.filter((st) =>
    (!filters.country || st.country === filters.country) &&
    (!filters.region || st.region === filters.region) &&
    (!filters.city || st.city === filters.city) &&
    (!q || [st.name, st.frequency, st.city, st.region, st.country]
      .some((v) => v && String(v).toLowerCase().includes(q))));
}
function fillSelect(sel, values, allLabel) {
  const prev = sel.value;
  sel.length = 0;
  const all = document.createElement("option");
  all.value = "";
  all.textContent = allLabel;
  sel.appendChild(all);
  for (const v of values) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  }
  sel.value = values.includes(prev) ? prev : "";
  return sel.value;
}
function applyFilters() {
  const cSel = $("#f-country"), rSel = $("#f-region"), xSel = $("#f-city");
  filters.country = fillSelect(cSel, uniqSorted(stations.map((s) => s.country)), "All countries");
  const inCountry = stations.filter((s) => !filters.country || s.country === filters.country);
  filters.region = fillSelect(rSel, uniqSorted(inCountry.map((s) => s.region)), "All regions");
  const inRegion = inCountry.filter((s) => !filters.region || s.region === filters.region);
  filters.city = fillSelect(xSel, uniqSorted(inRegion.map((s) => s.city)), "All cities");
  renderList();
  renderMarkers();
}

// Stations at (or very near) the same location get fanned out onto a circle
// around their shared point so every pin is visible and clickable.
// Positions are stored on st._lat / st._lng and used for both pin and centering.
function fanOut(list) {
  const R = 0.0025; // ~280 m fan radius
  const THRESHOLD_KM = 0.4; // closer than this counts as co-located
  const n = list.length;
  const valid = list.map((st) => typeof st.lat === "number" && typeof st.lng === "number");
  // Union-find: merge every pair of stations within THRESHOLD_KM.
  const parent = list.map((_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  const distKm = (a, b) => {
    const midLat = ((a.lat + b.lat) / 2) * Math.PI / 180;
    const dx = (a.lng - b.lng) * 111.32 * Math.cos(midLat);
    const dy = (a.lat - b.lat) * 110.57;
    return Math.hypot(dx, dy);
  };
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (valid[i] && valid[j] && distKm(list[i], list[j]) < THRESHOLD_KM) union(i, j);
    }
  }
  const groups = new Map();
  list.forEach((st, i) => {
    if (!valid[i]) { st._lat = null; st._lng = null; return; }
    const root = find(i);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(st);
  });
  for (const group of groups.values()) {
    if (group.length === 1) {
      const st = group[0];
      st._lat = st.lat; st._lng = st.lng;
      continue;
    }
    const lat = group.reduce((s, st) => s + st.lat, 0) / group.length;
    const lng = group.reduce((s, st) => s + st.lng, 0) / group.length;
    const cosLat = Math.max(Math.cos(lat * Math.PI / 180), 0.2);
    group.forEach((st, i) => {
      const a = (2 * Math.PI * i) / group.length - Math.PI / 2;
      st._lat = lat + R * Math.sin(a);
      st._lng = lng + (R * Math.cos(a)) / cosLat;
    });
  }
}

function centerOn(st) {
  const lat = typeof st._lat === "number" ? st._lat : st.lat;
  const lng = typeof st._lng === "number" ? st._lng : st.lng;
  if (typeof lat === "number" && typeof lng === "number") {
    map.flyTo([lat, lng], 15, { duration: 0.8 });
  }
}

function showStatus(kind, msg, ms) {
  const el = $("#status");
  el.className = "show " + kind;
  el.textContent = msg;
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => { el.className = ""; }, ms);
}

function refreshPlayBtn() {
  $("#play-btn").innerHTML = audio.paused ? "&#9654;" : "&#10074;&#10074;";
  $("#eq").hidden = audio.paused;
}

function pinIcon(st, playing) {
  return L.divIcon({
    className: "pin" + (playing ? " playing" : ""),
    html: '<div class="dot">' + logoImg(st, "logo") + "</div>",
    iconSize: [44, 44],
    iconAnchor: [22, 40],
  });
}

function renderMarkers() {
  if (clusterGroup) map.removeLayer(clusterGroup);
  markers.clear();
  fanOut(stations);
  clusterGroup = L.markerClusterGroup({
    showCoverageOnHover: false,
    maxClusterRadius: 60,
    spiderfyOnMaxZoom: true,
    iconCreateFunction: (c) => {
      const playing = current && !audio.paused &&
        c.getAllChildMarkers().some((m) => m.stId === current);
      return L.divIcon({
        html: '<div class="cluster-badge' + (playing ? " playing" : "") + '">' + c.getChildCount() + "</div>",
        className: "",
        iconSize: [46, 46],
      });
    },
  });
  for (const st of visible()) {
    if (typeof st._lat !== "number" || typeof st._lng !== "number") continue;
    const playing = current === st.id && !audio.paused;
    const m = L.marker([st._lat, st._lng], { icon: pinIcon(st, playing) });
    m.stId = st.id;
    m.bindTooltip(fmtFreq(st) + " &mdash; " + esc(st.name), { direction: "top", offset: [0, -34] });
    m.on("click", () => togglePlay(st));
    clusterGroup.addLayer(m);
    markers.set(st.id, m);
  }
  map.addLayer(clusterGroup);
}

function renderList() {
  const list = $("#station-list");
  list.innerHTML = "";
  const vis = visible();
  const sorted = [...vis].sort((a, b) =>
    fmtFreq(a).localeCompare(fmtFreq(b), undefined, { numeric: true }));
  for (const st of sorted) {
    const el = document.createElement("div");
    el.className = "station" + (current === st.id && !audio.paused ? " playing" : "");
    const loc = [st.city, st.region, st.country].filter(Boolean).join(" \u00b7 ");
    el.innerHTML =
      logoImg(st, "logo") +
      '<span class="freq">' + esc(fmtFreq(st)) + "</span>" +
      '<span class="meta"><span class="name">' + esc(st.name) + "</span>" +
      '<span class="tags">' + esc([st.codec, loc].filter(Boolean).join(" \u00b7 ")) + "</span></span>";
    el.addEventListener("click", () => togglePlay(st));

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.title = "Delete station";
    del.setAttribute("aria-label", "Delete " + st.name);
    del.innerHTML = X_SVG;
    del.addEventListener("click", (ev) => { ev.stopPropagation(); requestDelete(st); });
    el.appendChild(del);

    list.appendChild(el);
  }
  $("#count").textContent = vis.length;
  $("#total").textContent = stations.length;
}
function stopHls() {
  if (hls) { try { hls.destroy(); } catch (e) { /* noop */ } hls = null; }
}

function stopPlayback() {
  stopHls();
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  current = null;
  $("#p-title").textContent = "Nothing playing";
  $("#p-sub").textContent = "Pick a station to start";
  refreshPlayBtn();
  renderList();
  renderMarkers();
}

function startPlayback(st) {
  stopHls();
  audio.pause();
  audio.removeAttribute("src");
  current = st.id;
  centerOn(st);
  $("#p-title").textContent = st.name;
  $("#p-sub").textContent = fmtFreq(st) + " \u00b7 " + (st.codec || "audio") + " \u00b7 " + st.stream;
  renderList();
  renderMarkers();
  const url = proxied(st);

  if (st.hls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3 });
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      audio.play().catch(() => showStatus("error", "Autoplay was blocked \u2014 click the play button."));
    });
    hls.on(Hls.Events.ERROR, (_evt, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else showStatus("error", "HLS error: " + data.details);
    });
  } else {
    audio.src = url; // plain MP3/AAC, or native HLS on Safari
    audio.play().catch(() =>
      showStatus("error", "Could not start the stream \u2014 the URL may be down or blocked."));
  }
}

function togglePlay(st) {
  if (current === st.id && !audio.paused) {
    audio.pause();
    return;
  }
  startPlayback(st);
}

// Pins and the cluster badge only reflect the *live* playback state, so
// re-render them whenever playback actually starts/stops (the play and
// pause events fire asynchronously, after startPlayback's own render pass,
// which always runs while audio is still paused).
function refreshUI() {
  renderList();
  renderMarkers();
}
audio.addEventListener("play", () => { refreshPlayBtn(); refreshUI(); });
audio.addEventListener("pause", () => { refreshPlayBtn(); refreshUI(); });
audio.addEventListener("error", () => {
  if (current) showStatus("error", "Stream failed \u2014 the URL may be down, or the server blocked it.");
});

$("#play-btn").addEventListener("click", () => {
  if (current) {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
    refreshPlayBtn();
  } else {
    const vis = visible();
    if (vis.length) startPlayback(vis[0]);
  }
});

$("#vol").addEventListener("input", (e) => {
  audio.volume = parseFloat(e.target.value);
  audio.muted = false;
});

["f-country", "f-region", "f-city"].forEach((id) =>
  $("#" + id).addEventListener("change", applyFilters));

$("#f-search").addEventListener("input", (e) => {
  filters.search = e.target.value;
  renderList();
  renderMarkers();
});

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.code === "Space") {
    e.preventDefault();
    $("#play-btn").click();
  }
});



  /* ---------------- Add station ---------------- */
  const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>';

  const addOverlay = $("#add-overlay");
  function openAdd() {
    $("#add-form").reset();
    addOverlay.classList.add("show");
    $("#a-name").focus();
  }
  function closeAdd() { addOverlay.classList.remove("show"); }
  $("#add-fab").addEventListener("click", openAdd);
  $("#add-cancel").addEventListener("click", closeAdd);
  addOverlay.addEventListener("click", (e) => { if (e.target === addOverlay) closeAdd(); });

  $("#add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const latRaw = $("#a-lat").value.trim();
    const lngRaw = $("#a-lng").value.trim();
    if ((latRaw === "") !== (lngRaw === "")) {
      showStatus("error", "Provide both latitude and longitude, or neither.");
      return;
    }
    const body = {
      name: $("#a-name").value.trim(),
      stream: $("#a-stream").value.trim(),
      frequency: $("#a-freq").value.trim() || null,
      codec: $("#a-codec").value.trim() || null,
      country: $("#a-country").value.trim() || null,
      region: $("#a-region").value.trim() || null,
      city: $("#a-city").value.trim() || null,
      logo: $("#a-logo").value.trim() || null,
      hls: $("#a-hls").checked,
    };
    const lat = parseFloat(latRaw), lng = parseFloat(lngRaw);
    if (Number.isFinite(lat) && Number.isFinite(lng)) { body.lat = lat; body.lng = lng; }
    try {
      const r = await fetch("/api/stations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
      const created = await r.json();
      stations.push(created);
      closeAdd();
      applyFilters();
      showStatus("ok", "Added " + created.name, 2500);
    } catch (err) {
      showStatus("error", "Could not add station: " + err.message);
    }
  });

  /* ---------------- Delete station ---------------- */
  const delOverlay = $("#del-overlay");
  let pendingDelete = null;
  function requestDelete(st) {
    pendingDelete = st;
    $("#del-msg").textContent = "This will remove \u201c" + st.name + "\u201d from the map." +
      (current === st.id ? " It is currently playing, so playback will stop." : "");
    delOverlay.classList.add("show");
    $("#del-confirm").focus();
  }
  function closeDelete() { delOverlay.classList.remove("show"); pendingDelete = null; }
  $("#del-cancel").addEventListener("click", closeDelete);
  delOverlay.addEventListener("click", (e) => { if (e.target === delOverlay) closeDelete(); });

  $("#del-confirm").addEventListener("click", async () => {
    const st = pendingDelete;
    closeDelete();
    if (!st) return;
    try {
      const r = await fetch("/api/stations/" + st.id, { method: "DELETE" });
      if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
      if (current === st.id) stopPlayback();
      stations = stations.filter((s) => s.id !== st.id);
      applyFilters();
      showStatus("ok", "Deleted " + st.name, 2500);
    } catch (err) {
      showStatus("error", "Could not delete station: " + err.message);
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeAdd(); closeDelete(); }
  });

(async function init() {
  try {
    const r = await fetch("/api/stations");
    stations = await r.json();
  } catch (e) {
    showStatus("error", "Could not load stations: " + e.message);
    return;
  }
  applyFilters();
  refreshPlayBtn();
})();
</script>
